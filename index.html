<!DOCTYPE html>
<html lang="en" data-theme="ShortJob">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ShortJob — Academic Social Network for job seekers and job creaters"
    />
    <meta name="theme-color" content="#147F83" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Roboto+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ShortJob — Academic Social Network</title>
    <script>
      (function () {
        var mode = localStorage.getItem("shortjob-theme-mode") || "system";
        var dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "ShortJobDark" : "ShortJob"
        );
        var fontMode = localStorage.getItem("shortjob-font-mode") || "modern";
        var fontModes = [
          "modern",
          "professional",
          "rounded",
          "editorial",
          "compact",
          "system",
        ];
        document.documentElement.setAttribute(
          "data-font",
          fontModes.indexOf(fontMode) >= 0 ? fontMode : "modern"
        );
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute("content", "#147F83");
        }
      })();
    </script>
    <!-- Open Graph / Social Meta -->
    <meta property="og:title" content="ShortJob — Academic Social Network"/>
    <meta property="og:description" content="Connect jon seeker with job creaters and institutions. Find academic roles, post jobs, and build your academic network."/>
    <meta property="og:image" content="https://short-job-3.vercel.app"/>
    <meta name="application-name" content="ShortJob"/>

  </head>

    <!-- Google Tag Manager (noscript) -->

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </body>
</html>
